<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Полная документация — mathNote</title>
  <script>
    try {
      if (localStorage.getItem('mathNote.theme') === 'dark') {
        document.documentElement.dataset.theme = 'dark';
      }
    } catch {}
  </script>
  <style>
    :root {
      --bg: #f3f4f6;
      --bg-glow: #d1fae5;
      --paper: #ffffff;
      --ink: #1c1917;
      --muted: #78716c;
      --line: #e7e5e4;
      --hover-line: #a8a29e;
      --accent: #0f766e;
      --kbd-bg: #f5f5f4;
      --shadow: rgba(28, 25, 23, 0.04);
      --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      --mono: "IBM Plex Mono", "SFMono-Regular", ui-monospace, monospace;
    }
    html[data-theme="dark"] {
      --bg: #121416;
      --bg-glow: #134e4a;
      --paper: #1c1f24;
      --ink: #e7e5e4;
      --muted: #a8a29e;
      --line: #2f343c;
      --hover-line: #57534e;
      --accent: #2dd4bf;
      --kbd-bg: #252a31;
      --shadow: rgba(0, 0, 0, 0.35);
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html { font-size: 130%; color-scheme: light; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: var(--sans);
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, var(--bg-glow) 0%, transparent 50%),
        var(--bg);
    }
    .wrap {
      max-width: 1254px;
      margin: 0 auto;
      padding: 1.25rem 1.25rem 4rem;
    }
    header,
    .bottom-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      align-items: center;
      justify-content: space-between;
    }
    header { margin-bottom: 1.25rem; }
    .nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .brand {
      font-weight: 650;
      letter-spacing: -0.02em;
      font-size: 1.1rem;
      color: inherit;
      text-decoration: none;
    }
    .brand span { color: var(--accent); }
    a.back {
      font: inherit;
      font-size: 0.9rem;
      font-weight: 550;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      border-radius: 8px;
      padding: 0.45rem 0.85rem;
      text-decoration: none;
    }
    a.back:hover { border-color: var(--hover-line); }
    .sheet {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1.5rem 1.5rem 2.25rem;
      box-shadow: 0 10px 30px var(--shadow);
    }
    h1 {
      margin: 0 0 0.45rem;
      font-size: 1.45rem;
    }
    h2 {
      margin: 1.5rem 0 0.45rem;
      padding-top: 0.15rem;
      border-top: 1px solid var(--line);
      font-size: 1.08rem;
    }
    h3 {
      margin: 1.05rem 0 0.35rem;
      font-size: 0.98rem;
    }
    p, li {
      font-size: 0.92rem;
      line-height: 1.55;
    }
    p { margin: 0 0 0.7rem; }
    ul {
      margin: 0 0 0.85rem;
      padding-left: 1.25rem;
    }
    li + li { margin-top: 0.22rem; }
    code {
      font-family: var(--mono);
      font-size: 0.83em;
      border: 1px solid var(--line);
      background: var(--kbd-bg);
      border-radius: 5px;
      padding: 0.05em 0.3em;
      overflow-wrap: anywhere;
    }
    .loading,
    .error {
      color: var(--muted);
    }
    .error a { color: var(--accent); }
    .bottom-nav {
      justify-content: flex-start;
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--line);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <nav class="nav-links" aria-label="Навигация">
        <a class="back" href="guide.html">Назад в гайд</a>
        <a class="back" href="index.html">К листу</a>
      </nav>
      <a class="brand" href="index.html">math<span>Note</span></a>
    </header>

    <main class="sheet">
      <article id="documentation">
        <p class="loading">Загрузка документации…</p>
      </article>
      <nav class="bottom-nav" aria-label="Навигация внизу страницы">
        <a class="back" href="guide.html">Назад в гайд</a>
        <a class="back" href="index.html">К листу</a>
      </nav>
    </main>
  </div>

  <script>
    const documentation = document.getElementById('documentation');

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function renderInline(value) {
      let text = escapeHtml(value);
      text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
      text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      text = text.replace(/\\\((.*?)\\\)/g, '<code>$1</code>');
      return text;
    }

    function renderMarkdown(markdown) {
      const lines = markdown.replace(/\r\n?/g, '\n').split('\n');
      const html = [];
      let listOpen = false;

      const closeList = () => {
        if (!listOpen) return;
        html.push('</ul>');
        listOpen = false;
      };

      for (const rawLine of lines) {
        const line = rawLine.trim();
        if (!line) {
          closeList();
          continue;
        }

        const heading = /^(#{1,3})\s+(.+)$/.exec(line);
        if (heading) {
          closeList();
          const level = heading[1].length;
          html.push(`<h${level}>${renderInline(heading[2])}</h${level}>`);
          continue;
        }

        const item = /^-\s+(.+)$/.exec(line);
        if (item) {
          if (!listOpen) {
            html.push('<ul>');
            listOpen = true;
          }
          html.push(`<li>${renderInline(item[1])}</li>`);
          continue;
        }

        closeList();
        html.push(`<p>${renderInline(line)}</p>`);
      }

      closeList();
      return html.join('\n');
    }

    fetch('SHORTCUTS.md')
      .then((response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.text();
      })
      .then((markdown) => {
        const visiblePart = markdown.split('\n## Освобождённые сочетания')[0].trim();
        documentation.innerHTML = renderMarkdown(visiblePart);
      })
      .catch(() => {
        documentation.innerHTML =
          '<h1>Полная документация</h1>' +
          '<p class="error">Не удалось загрузить страницу. ' +
          '<a href="SHORTCUTS.md">Открыть исходный Markdown-файл</a>.</p>';
      });
  </script>
</body>
</html>
