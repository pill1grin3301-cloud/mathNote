server {
    listen 80;
    server_name _;

    client_max_body_size 8m;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://host.docker.internal:8042;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://host.docker.internal:8042/health;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://host.docker.internal:8042/docs;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://host.docker.internal:8042/redoc;
        proxy_set_header Host $host;
    }

    location = /openapi.json {
        proxy_pass http://host.docker.internal:8042/openapi.json;
        proxy_set_header Host $host;
    }
}
